# Galli.Pay et le tableau de la Gallia : https://pay.gallia.space
# Le HTTPS est assuré par le Traefik déjà présent sur le serveur (celui de n8n, non modifié) :
# il découvre ce conteneur grâce aux étiquettes ci-dessous et obtient le certificat Let's Encrypt tout seul.
# La page elle-même écoute sur le port libre 8090, seulement en interne (127.0.0.1 et réseau Docker de Traefik).
name: galli-pay
services:
  web:
    image: nginx:1.27-alpine
    container_name: galli-pay
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.gallipay-https.rule: Host(`pay.gallia.space`)
      traefik.http.routers.gallipay-https.entrypoints: websecure
      traefik.http.routers.gallipay-https.tls.certresolver: mytlschallenge
      traefik.http.services.gallipay.loadbalancer.server.url: http://172.18.0.1:8090
