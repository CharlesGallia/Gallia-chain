# ESSAI : Galli.Pay branché sur la chaîne de TEST (comptes publics, aucune valeur) : sert la page et relaie, en lecture/envoi de transactions seulement :
#   /ws      -> nœud Gallia (RPC limité aux fonctions sûres, --rpc-methods=safe)
#   /graphql -> API de l'indexeur
server {
  listen 127.0.0.1:8091;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'wasm-unsafe-eval'" always;

  location / { try_files $uri /index.html; }

  location /ws {
    proxy_pass http://127.0.0.1:9945;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location = /graphql {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:4351/v1/graphql;  # indexeur de la chaîne de test
  }
}
